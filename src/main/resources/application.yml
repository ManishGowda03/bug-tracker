server:
  port: 8080

spring:
  application:
    name: bug-tracker

  # Default profile = MySQL. Set env vars, or run with
  # `--spring.profiles.active=h2` for zero-setup local testing.
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bugtracker}?createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

jwt:
  # In a real deployment this comes from an env variable, never hardcoded.
  secret: ${JWT_SECRET:bug-tracker-super-secret-key-change-me-in-production-1234567890}
  expiration-ms: 86400000   # 24 hours

springdoc:
  swagger-ui:
    path: /swagger-ui.html